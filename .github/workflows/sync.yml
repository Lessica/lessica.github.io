name: Sync with upstream

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/sync.yml"
      - "devkit/**"
      - "manifest.json"
      - "requirements.txt"
  schedule:
    # Pick up new upstream releases once a day.
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apt-repository
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: 3.12
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install -r requirements.txt

      - name: Collect icons
        run: |
          source .venv/bin/activate
          python devkit/collect_icons.py

      - name: Build repository
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          source .venv/bin/activate
          python devkit/build_repository.py

      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}

      - name: Configure Git for signed commits
        run: |
          signing_key="$(gpg --list-secret-keys --keyid-format LONG | grep 'sec' | awk '{print $2}' | cut -d'/' -f2)"
          git config --global user.name "Build Service"
          git config --global user.email "i.82@outlook.com"
          git config --global commit.gpgSign true
          git config --global user.signingkey "$signing_key"

      - name: Push changes
        run: |
          git add Packages Packages.gz Packages.bz2 Packages.xz Packages.zst Release icons
          if git diff --cached --quiet -- Packages Packages.gz Packages.bz2 Packages.xz Packages.zst icons; then
            echo "No package or icon changes."
            git reset --hard HEAD
            exit 0
          fi
          git commit -sS -m "update dists"
          git push
